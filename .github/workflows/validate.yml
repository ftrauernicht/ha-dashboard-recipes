name: Validate recipes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this job only reads the repository. The repository default is
# write so the auto-merge job can merge; pinning it here keeps this workflow at
# what it actually needs.
permissions:
  contents: read

jobs:
  validate:
    name: Validate recipes.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate_recipes.py
